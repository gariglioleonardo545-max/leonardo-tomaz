<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Controle LED ESP32</title>

    <style>

        body {
            font-family: Arial, sans-serif;

            background: #f2f2f2;

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .container {

            background: white;

            width: 90%;

            max-width: 450px;

            padding: 35px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }


        h1 {

            margin-bottom: 10px;
        }


        .descricao {

            color: #666;

            margin-bottom: 25px;
        }


        .led {

            width: 120px;

            height: 120px;

            border-radius: 50%;

            margin: 25px auto;

            background: #555;

            border: 8px solid #ddd;

            transition: 0.3s;
        }


        .led.ligado {

            background: #00ff00;

            box-shadow:
                0 0 20px #00ff00,
                0 0 50px #00ff00;
        }


        .estado {

            font-size: 24px;

            font-weight: bold;

            margin: 20px;
        }


        button {

            width: 100%;

            padding: 18px;

            margin-top: 12px;

            border: none;

            border-radius: 12px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;
        }


        .ligar {

            background: #16a34a;

            color: white;
        }


        .desligar {

            background: #dc2626;

            color: white;
        }


        button:hover {

            opacity: 0.85;
        }


        #mensagem {

            margin-top: 20px;

            font-weight: bold;
        }


        .firebase {

            margin-top: 20px;

            padding: 12px;

            background: #f5f5f5;

            border-radius: 10px;

            font-family: monospace;
        }

    </style>

</head>


<body>


<div class="container">


    <h1>💡 Controle do LED ESP32</h1>


    <p class="descricao">

        Firebase + ESP32 + Cirkit Designer

    </p>


    <!-- LED VIRTUAL DA PÁGINA -->

    <div id="ledVisual"
         class="led">
    </div>


    <!-- ESTADO -->

    <div id="estado"
         class="estado">

        Verificando...

    </div>


    <!-- BOTÃO LIGAR -->

    <button
        class="ligar"
        onclick="ligarLED()">

        🟢 LIGAR LED

    </button>


    <!-- BOTÃO DESLIGAR -->

    <button
        class="desligar"
        onclick="desligarLED()">

        🔴 DESLIGAR LED

    </button>


    <div id="mensagem">

        Conectando ao Firebase...

    </div>


    <div class="firebase">

        Firebase:

        <span id="firebaseValor">

            ---

        </span>

    </div>


</div>



<script>


// =====================================================
// SEU FIREBASE
// =====================================================

const FIREBASE_URL =
"https://leonardo-89179-default-rtdb.firebaseio.com/led.json";



// =====================================================
// ELEMENTOS DA PÁGINA
// =====================================================

const ledVisual =
document.getElementById("ledVisual");

const estado =
document.getElementById("estado");

const mensagem =
document.getElementById("mensagem");

const firebaseValor =
document.getElementById("firebaseValor");



// =====================================================
// ATUALIZA O LED DA PÁGINA
// =====================================================

function atualizarTela(valor)
{

    if (valor === true)
    {

        ledVisual.classList.add("ligado");

        estado.textContent =
        "🟢 LED LIGADO";

        firebaseValor.textContent =
        "true";

    }

    else
    {

        ledVisual.classList.remove("ligado");

        estado.textContent =
        "⚫ LED DESLIGADO";

        firebaseValor.textContent =
        "false";

    }

}



// =====================================================
// ENVIAR VALOR PARA FIREBASE
// =====================================================

async function enviarComando(valor)
{

    try
    {

        mensagem.textContent =
        "Enviando comando para o Firebase...";


        const resposta =
        await fetch(
            FIREBASE_URL,
            {
                method: "PUT",

                headers:
                {
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify(valor)
            }
        );


        if (!resposta.ok)
        {

            throw new Error(
                "Erro HTTP: " +
                resposta.status
            );

        }


        atualizarTela(valor);


        if (valor === true)
        {

            mensagem.textContent =
            "LED ligado com sucesso!";

        }

        else
        {

            mensagem.textContent =
            "LED desligado com sucesso!";

        }

    }


    catch (erro)
    {

        console.error(erro);

        mensagem.textContent =
        "Erro ao acessar o Firebase.";

    }

}



// =====================================================
// LIGAR LED
// =====================================================

function ligarLED()
{

    enviarComando(true);

}



// =====================================================
// DESLIGAR LED
// =====================================================

function desligarLED()
{

    enviarComando(false);

}



// =====================================================
// LER FIREBASE
// =====================================================

async function lerFirebase()
{

    try
    {

        const resposta =
        await fetch(FIREBASE_URL);


        if (!resposta.ok)
        {

            throw new Error(
                "Erro HTTP: " +
                resposta.status
            );

        }


        const valor =
        await resposta.json();


        if (valor === true)
        {

            atualizarTela(true);

            mensagem.textContent =
            "Firebase conectado.";

        }


        else if (valor === false)
        {

            atualizarTela(false);

            mensagem.textContent =
            "Firebase conectado.";

        }

    }


    catch (erro)
    {

        console.error(erro);

        mensagem.textContent =
        "Erro ao conectar ao Firebase.";

    }

}



// =====================================================
// INICIAR
// =====================================================

lerFirebase();



// =====================================================
// VERIFICAR FIREBASE A CADA 2 SEGUNDOS
// =====================================================

setInterval(
    lerFirebase,
    2000
);


</script>


</body>

</html>
